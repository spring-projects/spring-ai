name: ai
version: true
title: Spring AI
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    - run:
        command: mvnw process-resources
        local: true
      scan:
        dir: spring-ai-docs/target/classes/antora-resources
asciidoc:
  attributes:
    agent-utils-docs: 'https://spring-ai-community.github.io/spring-ai-agent-utils/latest'
    decision-extensions-docs: 'https://spring-ai-community.github.io/spring-ai-decision-extensions/latest-snapshot'
    session-extensions-docs: 'https://spring-ai-community.github.io/spring-ai-session-extensions/latest-snapshot'
