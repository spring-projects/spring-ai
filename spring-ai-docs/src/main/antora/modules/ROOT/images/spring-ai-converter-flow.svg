<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 172" width="1130" role="img" aria-labelledby="converter-flow-title converter-flow-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="converter-flow-ext" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="var(--body-background-color, #fff)" stroke="currentColor" stroke-opacity="0.7"/></marker><marker id="converter-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="converter-flow-has" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M1 5 L7 1 L13 5 L7 9 z" fill="currentColor" fill-opacity="0.7"/></marker></defs>
<title id="converter-flow-title">How a converter takes part in a ChatModel call</title>
<desc id="converter-flow-desc">The converter's getFormat() supplies format instructions, which a PromptTemplate adds to your request. The chat model returns a ChatResponse; its text is cleaned by a ResponseTextCleaner and converted into the target type by convert().</desc>
<rect x="10" y="20" width="160" height="50" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="90.0" y="42.0" text-anchor="middle" font-size="13" font-weight="600">Your request</text><text x="90.0" y="59.0" text-anchor="middle" font-size="11" fill-opacity="0.75">user text</text>
<rect x="10" y="110" width="160" height="50" rx="8" fill="#6DB33F"/><text x="90.0" y="132.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">getFormat()</text><text x="90.0" y="149.0" text-anchor="middle" font-size="11" fill="#fff">format instructions</text>
<rect x="200" y="65" width="160" height="50" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="280.0" y="87.0" text-anchor="middle" font-size="13" font-weight="600">PromptTemplate</text><text x="280.0" y="104.0" text-anchor="middle" font-size="11" fill-opacity="0.75">fills {format}</text>
<rect x="390" y="65" width="160" height="50" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="470.0" y="87.0" text-anchor="middle" font-size="13" font-weight="600">ChatModel.call(...)</text><text x="470.0" y="104.0" text-anchor="middle" font-size="11" fill-opacity="0.75">returns a ChatResponse</text>
<rect x="580" y="65" width="160" height="50" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="660.0" y="87.0" text-anchor="middle" font-size="13" font-weight="600">getText()</text><text x="660.0" y="104.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the answer as text</text>
<rect x="770" y="65" width="160" height="50" rx="8" fill="#6DB33F"/><text x="850.0" y="87.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">clean(...)</text><text x="850.0" y="104.0" text-anchor="middle" font-size="11" fill="#fff">ResponseTextCleaner</text>
<rect x="960" y="65" width="160" height="50" rx="8" fill="#6DB33F"/><text x="1040.0" y="87.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">convert(...)</text><text x="1040.0" y="104.0" text-anchor="middle" font-size="11" fill="#fff">returns T</text>
<path d="M170.0 45.0 L185.0 45.0 L185.0 90.0 L196.0 90.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<path d="M170.0 135.0 L185.0 135.0 L185.0 100.0 L196.0 100.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<path d="M360.0 90.0 L386.0 90.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<path d="M550.0 90.0 L576.0 90.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<path d="M740.0 90.0 L766.0 90.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<path d="M930.0 90.0 L956.0 90.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#converter-flow-arrow)"/>
<rect x="0" y="4" width="180" height="170" rx="10" fill="none" stroke="none"/>
<text x="560.0" y="160.0" text-anchor="middle" font-size="12" fill-opacity="0.75">Green steps are the methods of the converter; the rest is your code or the model.</text>
</svg>
