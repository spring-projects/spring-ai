<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 514" width="780" role="img" aria-labelledby="decision-triage-example-title decision-triage-example-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
