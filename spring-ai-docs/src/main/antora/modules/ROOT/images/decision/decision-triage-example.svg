<title id="decision-triage-example-title">The support triage example: one prompt, one call, three answers</title>
<desc id="decision-triage-example-desc">The DecisionPrompt holds the input and three named questions about it. The input is a customer message: My new headphones arrived yesterday, but the left side doesn't work. Can I get my money back? The yes/no question defect asks whether the customer reports a defect. The choice question topic asks what the message is about, with the options delivery, product, account and other. The score question satisfaction asks how satisfied the customer is, on the levels unhappy, neutral and happy. One call of the DecisionModel answers all three, and the DecisionResponse has one answer for each question. The yes/no answer has the probability of yes, 0.97 in this example, and isYes() returns true because it is above the threshold of 0.5. The choice answer has a probability for each option, and getValue() returns product, the most likely one. The score answer has a probability for each level, and getNearestLevel() returns 0, the position of unhappy. The code then acts on the three results, for example by opening a repair ticket, sending the message to the product team and raising its priority. The probabilities, and what the code does with the results, are examples.</desc>
