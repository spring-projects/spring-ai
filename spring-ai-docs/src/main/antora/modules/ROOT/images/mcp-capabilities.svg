<svg xmlns="http://www.w3.org/2000/svg" id="mcp-capabilities" viewBox="0 0 900 696" width="900" role="img" aria-labelledby="mcp-capabilities-title mcp-capabilities-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<style>#mcp-capabilities a{color:inherit;text-decoration:none}#mcp-capabilities a:hover rect{stroke-width:2.4}</style>
<title id="mcp-capabilities-title">MCP client and server features in Spring AI</title>
<desc id="mcp-capabilities-desc">An MCP client and an MCP server talk over an MCP transport. Client features: roots, set on the client specification in a customizer; sampling, with @McpSampling; elicitation, with @McpElicitation. Server features: tools with @McpTool, resources with @McpResource, prompts with @McpPrompt, completion with @McpComplete, and logging, received on the client with @McpLogging. Change notifications for the tool, resource and prompt lists are sent by the server and handled on the client with @McpToolListChanged, @McpResourceListChanged and @McpPromptListChanged; a 2026-07-28 connection receives them only with listen=true. Shared features: progress with @McpProgress, ping and cancellation. Roots, sampling, logging, ping and cancellation are available on legacy connections only; the other features work with both generations of the protocol.</desc>
<a href="../client/index.html"><rect x="40" y="20" width="300" height="56" rx="7" fill="#6DB33F"/><text x="190.0" y="45.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MCP client</text><text x="190.0" y="61.0" text-anchor="middle" font-size="11" fill="#fff">in your application</text></a>
<a href="../server/index.html"><rect x="560" y="20" width="300" height="56" rx="7" fill="#6DB33F"/><text x="710.0" y="45.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MCP server</text><text x="710.0" y="61.0" text-anchor="middle" font-size="11" fill="#fff">your Spring AI server</text></a>
