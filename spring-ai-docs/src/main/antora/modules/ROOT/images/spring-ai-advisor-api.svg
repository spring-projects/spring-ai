<rect x="690" y="62" width="150" height="42" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="765.0" y="77.0" text-anchor="middle" font-size="10.5" fill-opacity="0.7">«marker»</text><text x="765.0" y="94.0" text-anchor="middle" font-size="13" font-weight="700">MemoryAdvisor</text>
