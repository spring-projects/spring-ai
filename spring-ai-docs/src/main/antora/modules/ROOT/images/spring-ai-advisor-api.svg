<rect x="10" y="400" width="410" height="91" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="215.0" y="420.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">CallAdvisorChain</text><path d="M10 430 H420" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="18.0" y="447.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">nextCall(ChatClientRequest): ChatClientResponse</text><text x="18.0" y="464.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">getCallAdvisors(): List&lt;CallAdvisor&gt;</text><text x="18.0" y="481.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">copy(CallAdvisor after): CallAdvisorChain</text>
<rect x="440" y="400" width="450" height="91" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="665.0" y="420.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">StreamAdvisorChain</text><path d="M440 430 H890" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="448.0" y="447.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">nextStream(ChatClientRequest): Flux&lt;ChatClientResponse&gt;</text><text x="448.0" y="464.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">getStreamAdvisors(): List&lt;StreamAdvisor&gt;</text><text x="448.0" y="481.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">copy(StreamAdvisor after): StreamAdvisorChain</text>
<rect x="10" y="520" width="410" height="86" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="215.0" y="535.0" text-anchor="middle" font-size="10.5" fill-opacity="0.7">«record»</text><text x="215.0" y="552.0" text-anchor="middle" font-size="13" font-weight="700">ChatClientRequest</text><path d="M10 562 H420" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="18.0" y="579.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">prompt(): Prompt</text><text x="18.0" y="596.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">context(): Map&lt;String, Object&gt;</text>
<rect x="440" y="520" width="450" height="86" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="665.0" y="535.0" text-anchor="middle" font-size="10.5" fill-opacity="0.7">«record»</text><text x="665.0" y="552.0" text-anchor="middle" font-size="13" font-weight="700">ChatClientResponse</text><path d="M440 562 H890" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="448.0" y="579.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">chatResponse(): ChatResponse</text><text x="448.0" y="596.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">context(): Map&lt;String, Object&gt;</text>
<text x="450.0" y="632.0" text-anchor="middle" font-size="12" fill-opacity="0.75">An advisor reads and changes the request, calls the next advisor through the chain, and reads and changes the response.</text>
</svg>
