<rect x="250" y="240" width="431" height="91" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="465.5" y="260.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">BaseAdvisor</text><path d="M250 270 H681" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="258.0" y="287.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">before(ChatClientRequest, AdvisorChain): ChatClientRequest</text><text x="258.0" y="304.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">after(ChatClientResponse, AdvisorChain): ChatClientResponse</text><text x="258.0" y="321.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">getScheduler(): Scheduler</text>
