<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" role="img" aria-labelledby="advisor-api-title advisor-api-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="advisor-api-ext" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="var(--body-background-color, #fff)" stroke="currentColor" stroke-opacity="0.7"/></marker><marker id="advisor-api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="advisor-api-has" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M1 5 L7 1 L13 5 L7 9 z" fill="currentColor" fill-opacity="0.7"/></marker></defs>
<title id="advisor-api-title">The Advisor API</title>
<desc id="advisor-api-desc">Advisor has a name and an order. CallAdvisor advises call() and StreamAdvisor advises stream(); BaseAdvisor implements both from a before() and an after() method. ToolAdvisor and MemoryAdvisor are marker interfaces. CallAdvisorChain and StreamAdvisorChain call the next advisor, list the advisors, and copy the chain after a given advisor. ChatClientRequest holds the prompt and a context map; ChatClientResponse holds the chat response and the context.</desc>
<rect x="330" y="10" width="220" height="74" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="440.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">Advisor</text><path d="M330 40 H550" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="338.0" y="57.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">getName(): String</text><text x="338.0" y="74.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">getOrder(): int</text>
<rect x="70" y="120" width="360" height="74" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="250.0" y="140.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">CallAdvisor</text><path d="M70 150 H430" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="78.0" y="167.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">adviseCall(ChatClientRequest, CallAdvisorChain)</text><text x="78.0" y="184.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">  : ChatClientResponse</text>
<rect x="450" y="120" width="380" height="74" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="640.0" y="140.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic">StreamAdvisor</text><path d="M450 150 H830" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="458.0" y="167.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">adviseStream(ChatClientRequest, StreamAdvisorChain)</text><text x="458.0" y="184.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">  : Flux&lt;ChatClientResponse&gt;</text>
<path d="M250.0 120.0 L250.0 100.0 L440.0 100.0 L440.0 84.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3" marker-end="url(#advisor-api-ext)"/>
