<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 398" width="1010" role="img" aria-labelledby="trace-title trace-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<title id="trace-title">The spans of a ChatClient call</title>
<desc id="trace-desc">A trace of a ChatClient call with retrieval and one tool call. The spring.ai.chat.client span contains the ToolCallingAdvisor span. Inside it, the QuestionAnswerAdvisor span contains a vector store query and the ChatModelCallAdvisor span with a gen_ai.client.operation span, in which the model asks for a tool. Then a spring.ai.tool span runs the tool, and the advisors after ToolCallingAdvisor run again: another vector store query and another model call, which gives the final answer.</desc>
