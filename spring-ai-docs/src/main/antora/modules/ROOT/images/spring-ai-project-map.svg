<svg xmlns="http://www.w3.org/2000/svg" id="spring-ai-project-map" viewBox="0 0 1140 638" width="1140" role="img" aria-labelledby="map-title map-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<style>#spring-ai-project-map a{color:inherit;text-decoration:none}#spring-ai-project-map a:hover rect{stroke-width:2.4}</style>
<title id="map-title">The building blocks of Spring AI</title>
<desc id="map-desc">Spring AI consists of the ChatClient and its building blocks (advisors, prompts, structured output, multimodality, tool calling and tool search, memory) with the agent harness built on them, the model APIs for chat, embedding, image, audio, moderation and decision models with their providers, vector stores, the ETL pipeline and retrieval augmented generation, the Model Context Protocol, the Session API, observability, evaluation, and resilience and safety. The Spring AI Community adds Agent Utils, A2A, ACP, the ACP Harness Client, Amazon Bedrock AgentCore, MCP Security, Decision Extensions and Session Extensions. Qxotic jinfer is a community-maintained model provider.</desc>
