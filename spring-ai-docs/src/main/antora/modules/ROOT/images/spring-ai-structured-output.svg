<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 282" width="1010" role="img" aria-labelledby="structured-output-title structured-output-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="structured-output-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="structured-output-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker></defs>
<title id="structured-output-title">Structured output with format instructions</title>
<desc id="structured-output-desc">The converter adds format instructions, such as a JSON schema, to your request. The chat model answers with text in that format, and the converter turns the text into a Java object. With native structured output, the provider constrains the answer to the schema.</desc>
<rect x="250" y="10" width="560" height="74" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="530.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700">Structured output converter</text>
<rect x="270" y="40" width="220" height="36" rx="8" fill="#6DB33F"/><text x="380.0" y="62.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Add format instructions</text>
<rect x="570" y="40" width="220" height="36" rx="8" fill="#6DB33F"/><text x="680.0" y="62.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Convert text to Java type</text>
<rect x="10" y="112" width="170" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="95.0" y="132.0" text-anchor="middle" font-size="13" font-weight="600">Your request</text><text x="95.0" y="149.0" text-anchor="middle" font-size="11" fill-opacity="0.75">user text</text>
<rect x="250" y="112" width="260" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="380.0" y="132.0" text-anchor="middle" font-size="13" font-weight="600">Request + format instructions</text><text x="380.0" y="149.0" text-anchor="middle" font-size="11" fill-opacity="0.75">e.g. a JSON schema</text>
<rect x="340" y="196" width="300" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="490.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600">Chat model</text><text x="490.0" y="233.0" text-anchor="middle" font-size="11" fill-opacity="0.75">answers with text</text>
<rect x="570" y="112" width="240" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="690.0" y="132.0" text-anchor="middle" font-size="13" font-weight="600">Text answer</text><text x="690.0" y="149.0" text-anchor="middle" font-size="11" fill-opacity="0.75">{"name": "Ada", "year": 1815}</text>
<rect x="860" y="112" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="930.0" y="132.0" text-anchor="middle" font-size="13" font-weight="600">Java object</text><text x="930.0" y="149.0" text-anchor="middle" font-size="11" fill-opacity="0.75">Person(Ada, 1815)</text>
<path d="M180.0 135.0 L246.0 135.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#structured-output-arrow)"/>
<path d="M380.0 76.0 L380.0 108.0" fill="none" stroke="#6DB33F" stroke-width="2.4" marker-end="url(#structured-output-arrow-green)"/>
<path d="M380.0 158.0 L380.0 192.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#structured-output-arrow)"/>
<path d="M600.0 196.0 L690.0 162.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#structured-output-arrow)"/>
<path d="M690.0 108.0 L690.0 80.0" fill="none" stroke="#6DB33F" stroke-width="2.4" marker-end="url(#structured-output-arrow-green)"/>
<path d="M790.0 58.0 L930.0 58.0 L930.0 108.0" fill="none" stroke="#6DB33F" stroke-width="2.4" marker-end="url(#structured-output-arrow-green)"/>
<text x="500.0" y="270.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75">With native structured output, the provider constrains the answer to the schema instead of relying on the instructions.</text>
</svg>
