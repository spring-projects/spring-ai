<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 494" width="930" role="img" aria-labelledby="tool-calling-title tool-calling-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="tool-calling-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="tool-calling-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker></defs>
<title id="tool-calling-title">The tool calling loop</title>
<desc id="tool-calling-desc">1: The application sends a prompt and its tools through Spring AI. 2: Spring AI sends the messages and the tool definitions to the model. 3: The model asks for a tool call with arguments. 4 and 5: Spring AI runs the tool and gets the result. 6: Spring AI sends the result to the model. Steps 3 to 6 repeat while the model asks for tools. 7: The model gives its final answer. 8: Spring AI returns the response to the application.</desc>
<rect x="10" y="10" width="160" height="38" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="90.0" y="33.5" text-anchor="middle" font-size="14">Your application</text>
