one</text><rect x="599" y="244" width="108" height="24" rx="6" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1"/><text x="653.0" y="260.1" text-anchor="middle" font-size="11.5">Chroma</text><rect x="713" y="244" width="108" height="24" rx="6" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1"/><text x="767.0" y="260.1" text-anchor="middle" font-size="11.5">and more</text>
