<path d="M221.0 327.0 L221.0 336.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#agent-harness-arrow)"/>
<path d="M221.0 385.0 L221.0 394.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#agent-harness-arrow)"/>
