<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 534" width="700" role="img" aria-labelledby="agent-harness-title agent-harness-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="agent-harness-ext" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="var(--body-background-color, #fff)" stroke="currentColor" stroke-opacity="0.7"/></marker><marker id="agent-harness-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="agent-harness-has" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M1 5 L7 1 L13 5 L7 9 z" fill="currentColor" fill-opacity="0.7"/></marker></defs>
<title id="agent-harness-title">Agent = Model + Harness</title>
<desc id="agent-harness-desc">An agent is a model plus a harness, everything that isn't the model. For an agent built on a ChatClient, the harness is the client's advisor chain and what it calls. ToolCallingAdvisor runs the loop and the tools, and for each tool round the rest of the chain runs again. SessionTurnAdvisor runs once per turn, outside the loop: it stores the turn in the session store and compacts the session. SessionMemoryAdvisor adds the history on every round. Recall tools let the model search the session. Your own advisors add hooks such as guardrails, retrieval and logging. StructuredOutputValidationAdvisor checks the output. ChatModelCallAdvisor, the last advisor, calls the chat model, which is outside the harness. The community project Spring AI Agent Utils adds more tools and advisors: Agent Skills, file system, shell, sandbox, sub-agents and long-term memory.</desc>
<text x="350" y="30" text-anchor="middle" font-size="20" font-weight="700">Agent = Model + <tspan fill="#6DB33F">Harness</tspan></text>
<rect x="8" y="50" width="684" height="410" rx="12" fill="#6DB33F" fill-opacity="0.05" stroke="#6DB33F" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="24.0" y="72.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#6DB33F">Harness: everything that isn't the model</text>
<text x="221.0" y="96.0" text-anchor="middle" font-size="12" fill-opacity="0.75" font-style="italic">the advisor chain of a ChatClient</text>
<rect x="56" y="106" width="330" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600">SessionTurnAdvisor</text><text x="221.0" y="143.0" text-anchor="middle" font-size="11" fill-opacity="0.75">once per turn: stores the turn, compacts</text>
<rect x="56" y="164" width="330" height="46" rx="8" fill="#6DB33F"/><text x="221.0" y="184.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ToolCallingAdvisor</text><text x="221.0" y="201.0" text-anchor="middle" font-size="11" fill="#fff">the loop: runs the tools the model asks for</text>
<rect x="56" y="222" width="330" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221.0" y="242.0" text-anchor="middle" font-size="13" font-weight="600">SessionMemoryAdvisor</text><text x="221.0" y="259.0" text-anchor="middle" font-size="11" fill-opacity="0.75">memory: the history, on every round</text>
<rect x="56" y="280" width="330" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="221.0" y="300.0" text-anchor="middle" font-size="13" font-weight="600">Your advisors</text><text x="221.0" y="317.0" text-anchor="middle" font-size="11" fill-opacity="0.75">hooks: guardrails, retrieval, logging</text>
<rect x="56" y="338" width="330" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221.0" y="358.0" text-anchor="middle" font-size="13" font-weight="600">StructuredOutputValidationAdvisor</text><text x="221.0" y="375.0" text-anchor="middle" font-size="11" fill-opacity="0.75">verification: checks the output</text>
<rect x="56" y="396" width="330" height="46" rx="8" fill="#6DB33F"/><text x="221.0" y="416.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ChatModelCallAdvisor</text><text x="221.0" y="433.0" text-anchor="middle" font-size="11" fill="#fff">calls the model</text>
