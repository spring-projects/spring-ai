<text x="549.0" y="96.0" text-anchor="middle" font-size="12" fill-opacity="0.75" font-style="italic">what the chain calls</text>
<rect x="420" y="106" width="258" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="549.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600">Session store</text><text x="549.0" y="143.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the event log of each conversation</text>
<path d="M388.0 129.0 L417.0 129.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agent-harness-arrow)"/>
<rect x="420" y="164" width="258" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="549.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600">Tools and MCP servers</text><text x="549.0" y="201.0" text-anchor="middle" font-size="11" fill-opacity="0.75">@Tool methods, MCP, recall tools</text>
<path d="M388.0 187.0 L417.0 187.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agent-harness-arrow)"/>
<rect x="420" y="280" width="258" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="549.0" y="300.0" text-anchor="middle" font-size="13" font-weight="600">Vector store, moderation model</text><text x="549.0" y="317.0" text-anchor="middle" font-size="11" fill-opacity="0.75">for retrieval and guardrails</text>
<path d="M388.0 303.0 L417.0 303.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agent-harness-arrow)"/>
<rect x="420" y="338" width="258" height="104" rx="8" fill="#3F7DE0" fill-opacity="0.12" stroke="#3F7DE0" stroke-width="1.2"/>
<text x="549.0" y="364.0" text-anchor="middle" font-size="13" font-weight="600" fill="#3F7DE0">Spring AI Agent Utils (Community)</text>
<text x="549.0" y="384.0" text-anchor="middle" font-size="11" fill-opacity="0.8">Agent Skills, file system, shell, sandbox,</text>
<text x="549.0" y="400.0" text-anchor="middle" font-size="11" fill-opacity="0.8">sub-agents, long-term memory:</text>
<text x="549.0" y="416.0" text-anchor="middle" font-size="11" fill-opacity="0.8">more tools and advisors for the chain</text>
