<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 468" width="890" role="img" aria-labelledby="chat-client-defaults-title chat-client-defaults-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="chat-client-defaults-ext" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="var(--body-background-color, #fff)" stroke="currentColor" stroke-opacity="0.7"/></marker><marker id="chat-client-defaults-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="chat-client-defaults-has" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M1 5 L7 1 L13 5 L7 9 z" fill="currentColor" fill-opacity="0.7"/></marker></defs>
<title id="chat-client-defaults-title">How request values combine with the ChatClient defaults</title>
<desc id="chat-client-defaults-desc">Each runtime method of a ChatClient request combines with the default set on ChatClient.Builder. tools(...) and advisors(...) add to the default tools and advisors. toolContext(...) merges with the default tool context, and the request wins on a shared key. system(...) and user(...) replace the default text when they set one, and add their parameters. options(...) replaces the client's default options builder; they are not merged. The resulting options are then combined over the chat model's default options, chatModel.getOptions(), and the values set on the client or the request win.</desc>
<text x="135.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700">ChatClient.Builder defaults</text>
<text x="415.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700">Request: chatClient.prompt()</text>
<text x="735.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700">What the request uses</text>
