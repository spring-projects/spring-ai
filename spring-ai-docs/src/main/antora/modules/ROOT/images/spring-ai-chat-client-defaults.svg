<rect x="20" y="242" width="230" height="50" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="135.0" y="271.5" text-anchor="middle" font-size="12.5">defaultSystem(...), defaultUser(...)</text>
