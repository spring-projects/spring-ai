<path d="M532.0 331.0 L597.0 331.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#chat-client-defaults-arrow)"/>
<rect x="600" y="306" width="270" height="50" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="735.0" y="328.0" text-anchor="middle" font-size="13" font-weight="600">Options</text><text x="735.0" y="345.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the request's builder replaces the client's</text>
<rect x="300" y="406" width="230" height="50" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="415.0" y="428.0" text-anchor="middle" font-size="13" font-weight="600">ChatModel default options</text><text x="415.0" y="445.0" text-anchor="middle" font-size="11" fill-opacity="0.75">chatModel.getOptions()</text>
