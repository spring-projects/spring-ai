<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="738px" preserveAspectRatio="none" style="width:828px;height:738px;background:#FFFFFF;" version="1.1" viewBox="0 0 828 738" width="828px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="21.1992" style="stroke:none;stroke-width:1;" width="795.4707" x="15" y="12.2969"/><ellipse cx="156.1797" cy="48.4961" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="270.3594" x="21" y="78.4961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.8652" x="31" y="100.0977">The request: the system prompt from</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.3594" x="31" y="114.2305">defaultSystem / .system, the user message</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="12.2969" y2="726.6211"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="306.0605" x="349.6641" y="146.7617"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.7031" x="359.6641" y="168.3633">Read the active view</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="286.0605" x="359.6641" y="182.4961">(the per-request filter merged over the advisor's)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285.9336" x="359.7275" y="215.0273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.9336" x="369.7275" y="236.6289">Take the latest stored system message, if any</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="358.1152" x="323.6367" y="269.1602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="338.1152" x="333.6367" y="290.7617">System messages first: the stored one, then the request's,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.1055" x="333.6367" y="304.8945">exact duplicates once</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="402.6699" x="301.3594" y="337.4258"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.3828" x="311.3594" y="359.0273">Prepend the history the request does not carry yet</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="382.6699" x="311.3594" y="373.1602">(from round 2 of a tool loop on, the prompt holds the turn so far)</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.5547" x="380.417" y="405.6914"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.5547" x="390.417" y="427.293">Drop a tool call left without its results,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.8828" x="390.417" y="441.4258">and a result that answers no call</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="303.6641" x="350.8623" y="473.957"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="283.6641" x="360.8623" y="495.5586">Store the request's user message (MessageFilter)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.6367" x="360.8623" y="509.6914">or its tool results (always)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="369.752" x="317.8184" y="596.3555"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="349.752" x="327.8184" y="617.957">Store the reply (MessageFilter; a reply with tool calls always)</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.7871" x="371.8008" y="650.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.7871" x="381.8008" y="672.0898">Name the stored event ids on the context</text><ellipse cx="502.6943" cy="715.6211" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="502.6943" cy="715.6211" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="295.3594" x2="295.3594" y1="12.2969" y2="726.6211"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="90.5938" x="714.0293" y="542.2227"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="70.5938" x="724.0293" y="563.8242">call(prompt)</text><line style="stroke:#000000;stroke-width:1.5;" x1="708.0293" x2="708.0293" y1="12.2969" y2="726.6211"/><line style="stroke:#000000;stroke-width:1.5;" x1="808.623" x2="808.623" y1="12.2969" y2="726.6211"/><line style="stroke:#181818;stroke-width:1;" x1="156.1797" x2="156.1797" y1="58.4961" y2="78.4961"/><polygon fill="#181818" points="152.1797,68.4961,156.1797,78.4961,160.1797,68.4961,156.1797,72.4961" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="195.0273" y2="215.0273"/><polygon fill="#181818" points="498.6943,205.0273,502.6943,215.0273,506.6943,205.0273,502.6943,209.0273" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="249.1602" y2="269.1602"/><polygon fill="#181818" points="498.6943,259.1602,502.6943,269.1602,506.6943,259.1602,502.6943,263.1602" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="317.4258" y2="337.4258"/><polygon fill="#181818" points="498.6943,327.4258,502.6943,337.4258,506.6943,327.4258,502.6943,331.4258" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="385.6914" y2="405.6914"/><polygon fill="#181818" points="498.6943,395.6914,502.6943,405.6914,506.6943,395.6914,502.6943,399.6914" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="453.957" y2="473.957"/><polygon fill="#181818" points="498.6943,463.957,502.6943,473.957,506.6943,463.957,502.6943,467.957" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="630.4883" y2="650.4883"/><polygon fill="#181818" points="498.6943,640.4883,502.6943,650.4883,506.6943,640.4883,502.6943,644.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="684.6211" y2="704.6211"/><polygon fill="#181818" points="498.6943,694.6211,502.6943,704.6211,506.6943,694.6211,502.6943,698.6211" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="156.1797" x2="156.1797" y1="126.7617" y2="131.7617"/><line style="stroke:#181818;stroke-width:1;" x1="156.1797" x2="502.6943" y1="131.7617" y2="131.7617"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="131.7617" y2="146.7617"/><polygon fill="#181818" points="498.6943,136.7617,502.6943,146.7617,506.6943,136.7617,502.6943,140.7617" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="502.6943" y1="522.2227" y2="527.2227"/><line style="stroke:#181818;stroke-width:1;" x1="502.6943" x2="759.3262" y1="527.2227" y2="527.