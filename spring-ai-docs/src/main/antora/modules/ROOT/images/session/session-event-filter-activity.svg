<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="646px" preserveAspectRatio="none" style="width:632px;height:646px;background:#FFFFFF;" version="1.1" viewBox="0 0 632 646" width="632px" zoomAndPan="magnify"><defs/><g><ellipse cx="358.7729" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="328.5525,50,388.9934,50,400.9934,62,388.9934,74,328.5525,74,316.5525,62,328.5525,50" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="60.4409" x="328.5525" y="66.1572">activeView?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.4829" x="299.0696" y="59.6797">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="400.9934" y="59.6797">no</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="380.0996" x="11" y="84"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.0605" x="21" y="105.6016">Project the view from the newest boundary:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="360.0996" x="21" y="119.7344">pinned, summary, preserved, then everything appended since</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="210.793" x="411.0996" y="84"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.793" x="421.0996" y="105.6016">The whole log, in insertion order</text><polygon fill="#F1F1F1" points="358.7729,138.2656,370.7729,150.2656,358.7729,162.2656,346.7729,150.2656,358.7729,138.2656" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5