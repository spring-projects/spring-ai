<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="311px" preserveAspectRatio="none" style="width:1007px;height:311px;background:#FFFFFF;" version="1.1" viewBox="0 0 1007 311" width="1007px" zoomAndPan="magnify"><defs/><g><ellipse cx="329.4293" cy="22" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="IDLE"><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.5176" x="219.4293" y="91"/><line style="stroke:#181818;stroke-width:0.5;" x1="219.4293" x2="438.9469" y1="117.4883" y2="117.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="29.5723" x="314.402" y="109.5352">IDLE</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.5176" x="224.4293" y="134.0898">the newest STATUS event, or none</text></g><g id="RUNNING"><rect fill="#F1F1F1" height="93.0195" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="302.6152" x="177.9293" y="212"/><line style="stroke:#181818;stroke-width:0.5;" x1="177.9293" x2="480.5446" y1="238.4883" y2="238.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.7314" x="297.3712" y="230.5352">RUNNING</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.5273" x="182.9293" y="255.0898">the run id owns the turn</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.6152" x="182.9293" y="269.2227">start by anyone throws TurnInProgressException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.416" x="182.9293" y="283.3555">until the lease, if any, ran out</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.7871" x="182.9293" y="297.4883">end by another run id is a no-op</text></g><polygon fill="#181818" points="329.4293,90.6358,333.4293,81.6358,329.4293,85.6358,325.4293,81.6358,329.4293,90.6358" style="stroke:#181818;stroke-width:1;"/><path d="M329.4293,36.0971 C329.4293,49.5961 329.4293,66.79 329.4293,84.6358 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.854" x="331.4293" y="68.5684">no STATUS event yet</text><polygon fill="#181818" points="177.6733,253.2753,169.025,248.5629,172.6895,252.8723,168.3801,256.5369,177.6733,253.2753" style="stroke:#181818;stroke-width:1;"/><path d="M219.2701,117.8813 C141.2758,120.7711 46.1404,130.5105 20.4293,160 C-33.5898,221.9575 68.7553,244.4674 171.6928,252.7917 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8291" x="100.4357" y="174.5684">start(runId, timeout)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.8418" x="22.4293" y="189.8789">appends STATUS(RUNNING, runId, expiresAt)</text><polygon fill="#181818" points="481.1899,269.5722,490.8522,271.48,486.0658,268.465,489.0808,263.6786,481.1899,269.5722" style="stroke:#181818;stroke-width:1;"/><path d="M481.1899,247.4278 C492.194,249.9265 498.9293,253.6172 498.9293,258.5 C498.9293,263.3828 498.0451,265.745 487.041,268.2436 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.3413" x="614.8158" y="256.0684">start(runId) after the lease ran out</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.1143" x="500.9293" y="271.3789">appends STATUS(IDLE, oldRunId, EXPIRED) + STATUS(RUNNING, runId)</text><polygon fill="#181818" points="329.4293,142.2069,325.4293,151.2069,329.4293,147.2069,333.4293,151.2069,329.4293,142.2069" style="stroke:#181818;stroke-width:1;"/><path d="M329.4293,211.8305 C329.4293,188.6649 329.4293,167.4391 329.4293,148.2069 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.7212" x="331.4293" y="174.5684">end(runId, END_TURN | ERROR | CANCELLED)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.9258" x="340.827" y="189.8789">appends STATUS(IDLE, runId, stopReason)</text><polygon fill="#181818" points="439.7632,119.3149,448.5386,123.7862,444.7562,119.5798,448.9626,115.7974,439.7632,119.3149" style="stroke:#181818;stroke-width:1;"/><path d="M481.0118,250.2597 C573.759,240.1966 666.0664,216.3412 617.4293,160 C594.3932,133.315 516.9358,123.4105 445.7548,119.6328 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.5581" x="762.2643" y="174.5684">interrupt(reason)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.228" x="632.4293" y="189.8789">appends INTERRUPT + STATUS(IDLE, runId, INTERRUPTED)</text><polygon fill="#181818" points="439.5809,124.4498,449.0644,127.1076,444.5284,123.7275,447.9086,119.1915,439.5809,124.4498" style="stroke:#181818;stroke-width:1;"/><path d="M439.5809,108.5502 C450.4905,110.143 457.4293,112.793 457.4293,116.5 C457.4293,120.207 456.4276,121.9901 445.5179,123.583 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.5581" x="485.131" y="114.0684">interrupt(reason)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9614" x="459.4293" y="129.3789">appends INTERRUPT only</text><!--SRC=[bP91IyD048Nl-ol6MwFf7_0Wb3P8eCII9Y2eoDfCsyLaTjdTc0RyyKxQr5Xj3vv2s