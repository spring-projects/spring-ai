<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="320px" preserveAspectRatio="none" style="width:1207px;height:320px;background:#FFFFFF;" version="1.1" viewBox="0 0 1207 320" width="1207px" zoomAndPan="magnify"><defs/><g><g id="RUNNING"><rect fill="#F1F1F1" height="93.0195" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="304.7129" x="297.0018" y="12"/><line style="stroke:#181818;stroke-width:0.5;" x1="297.0018" x2="601.7147" y1="38.4883" y2="38.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.7314" x="417.4925" y="30.5352">RUNNING</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.5273" x="302.0018" y="55.0898">the run id owns the turn</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.7129" x="302.0018" y="69.2227">start by any run throws TurnInProgressException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.416" x="302.0018" y="83.3555">until the lease, if any, ran out</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.4414" x="302.0018" y="97.4883">end and park by another run id are no-ops</text></g><g id="IDLE"><rect fill="#F1F1F1" height="64.7539" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.4668" x="756.5018" y="243"/><line style="stroke:#181818;stroke-width:0.5;" x1="756.5018" x2="1030.9686" y1="269.4883" y2="269.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="29.5723" x="878.949" y="261.5352">IDLE</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.4668" x="761.5018" y="286.0898">no STATUS event yet, or the last turn ended</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.9688" x="761.5018" y="300.2227">interrupt(reason) appends INTERRUPT only</text></g><g id="PARKED"><rect fill="#F1F1F1" height="78.8867" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="322.7598" x="9.0018" y="236"/><line style="stroke:#181818;stroke-width:0.5;" x1="9.0018" x2="331.7615" y1="262.4883" y2="262.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.4971" x="127.6331" y="254.5352">IDLE, parked</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.8594" x="14.0018" y="279.0898">the newest STATUS says REQUIRES_ACTION</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.7598" x="14.0018" y="293.2227">isParked() is true, start throws TurnParkedException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.9688" x="14.0018" y="307.3555">interrupt(reason) appends INTERRUPT only</text></g><ellipse cx="1176.5018" cy="56.5" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="elem_GMN2"><path d="M620.0018,23 L620.0018,54.5 L602.1483,58.5 L620.0018,62.5 L620.0018,94.2422 A0,0 0 0 0 620.0018,94.2422 L859.2279,94.2422 A0,0 0 0 0 859.2279,94.2422 L859.2279,33 L849.2279,23 L620.0018,23 A0,0 0 0 0 620.0018,23 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M849.2279,23 L849.2279,33 L859.2279,33 L849.2279,23 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.3413" x="626.0018" y="40.5684">start(runId) after the lease ran out</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.2261" x="626.0018" y="55.8789">takes the turn over in one append:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1143" x="626.0018" y="71.1895">STATUS(IDLE, oldRunId, EXPIRED)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.1104" x="626.0018" y="86.5">+ STATUS(RUNNING, runId)</text></g><polygon fill="#181818" points="1030.7427,260.8053,1040.2419,263.4061,1035.6858,260.0533,1039.0386,255.4971,1030.7427,260.8053" style="stroke:#181818;stroke-width:1;"/><path d="M1179.5323,70.8226 C1186.4578,99.4869 1200.0949,175.6474 1162.5018,218 C1144.1679,238.6551 1093.3511,251.2801 1036.6744,259.9028 " fill="none" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="544.4844,105.1305,548.7174,114.0233,548.2817,108.3832,553.9218,107.9476,544.4844,105.1305" style="stroke:#181818;stroke-width:1;"/><path d="M756.3657,264.0362 C685.9172,255.8742 609.6729,241.7833 584.5018,218 C552.9255,188.1647 587.6634,157.6811 561.5018,123 C556.5885,116.4868 555.3563,114.4433 549.0412,109.0338 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8291" x="664.5081" y="168.0684">start(runId, timeout)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.8418" x="586.5018" y="183.3789">appends STATUS(RUNNING, runId, expiresAt)</text><polygon fill="#181818" points="891.0037,242.763,894.2157,233.4526,890.5741,237.7815,886.2453,234.1399,891.0037,242.763" style="stroke:#181818;stroke-width:1;"/><path d="M602.3679,103.3327 C605.4324,103.9196 608.4794,104.4766 611.5018,105 C640.0352,109.941 850.2712,103.3066 871.5018,123 C880.1485,131.0207 886.8656,194.7743 890.4882,236.7851 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.5356" x="949.6969" y="137.5684">end(runId, stopReason)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.9258" x="890.5018" y="152.8789">appends STATUS(IDLE, runId, stopReason)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1020.908" y="168.1895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.5581" x="969.6856" y="183.5">interrupt(reason)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.2451" x="959.3421" y="198.8105">appends INTERRUPT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8696" x="905.5299" y="214.1211">+ STATUS(IDLE, runId, INTERRUPTED)</text><polygon fill="#181818" points="41.7032,235.7904,37.4248,226.9194,37.8893,232.5571,32.2515,233.0216,41.7032,235.7904" style="stroke:#181818;stroke-width:1;"/><path d="M296.8502,62.0263 C190.0367,67.4057 60.4473,82.4312 25.5018,123 C-2.0543,154.9903 1.6746,183.1434 25.5018,218 C30.0758,224.6912 30.9923,226.7101 37.1265,231.9105 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.1357" x="93.5015" y="160.5684">park(runId, question)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5986" x="98.7701" y="175.8789">appends QUESTION</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1353" x="27.5018" y="191.1895">+ STATUS(IDLE, runId, REQUIRES_ACTION)</text><polygon fill="#181818" points="335.8307,105.01,326.3,107.4931,331.9212,108.127,331.2872,113.7483,335.8307,105.01" style="stroke:#181818;stroke-width:1;"/><path d="M275.5301,235.8012 C282.551,230.565 289.0027,224.6574 294.5018,218 C322.1675,184.5065 290.1866,156.78 317.5018,123 C322.8584,116.3756 324.3821,114.1379 331.1393,108.7505 " fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2944" x="340.6109" y="160.5684">resume(runId, answer, timeout)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.7383" x="384.889" y="175.8789">appends ANSWER</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.5127" x="319.5018" y="191.1895">+ STATUS(RUNNING, runId, expiresAt)</text><!--SRC=[ZLBHRfj047pdAxPvCWt-WJnKiXfKeLRKmLYjL4VLDQpjas6FtYrn-FikdC4uSQI-691dPsPdvqDjrQvIKAhMD0okGbQa0dVGL2khAd1xLPYZfXriLUamsEi20QkQMoZGFLbTipOK18uL8sJhD4tIBy7f2NV0UmJR4EW2p95S_ysDfGb4HYt3dnOKjJsMzzOS7UG2IsXfpSwYS_7B4_PQ6sg8TTapbQWSHg2ttMm4LX786XDkf4B-Aa2MENW98tDsiAGi0fcvgTsmmKro_os-0UMWUmcw7w4X0wjyaQzNWCz832ro1CPw3yfnlr8dXiKmeedHsgRccHMJXa9GTIq88KxpEClMonmCbUs5SDGRnQ8ti5naN-Fxm3zEKH8UKUHEPfng7MJnmph9ujNlnUSy-PwUyTejUx9PAA_0jf6aVDQJW3ra37So_T_-9LAviTxj6Snsh01uhPaadHGol1Mwyyt6Km6mEk2v5s2U1QVbINXIl1EGNtZcCp9baNMi4SG_bxBwVIY8sm5pCX21Lmww2dGMW-3NnqUOppzDBjjzlIgYDnm1wmh5OBYXOU-h_17WIwsbe0iEnzuD8hw00wDZKsS-opUaVh5hm0szkSHvUZp5XcwlKes0BgIflV7ENU46XtyRAPU-K7XOnwkkLky9l6fVE1JeCbd9fwbma57aZcYlHRn8Lp_YRABrVjZ_0000]--></g></svg>