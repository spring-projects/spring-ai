<title id="converter-hierarchy-title">The structured output converters</title>
<desc id="converter-hierarchy-desc">StructuredOutputConverter combines FormatProvider and Converter. BeanOutputConverter implements it directly; MapOutputConverter extends AbstractMessageOutputConverter, and ListOutputConverter extends AbstractConversionServiceOutputConverter. BeanOutputConverter cleans the response text with a ResponseTextCleaner; by default a CompositeResponseTextCleaner that applies WhitespaceCleaner, ThinkingTagCleaner, MarkdownCodeBlockCleaner and WhitespaceCleaner again.</desc>
