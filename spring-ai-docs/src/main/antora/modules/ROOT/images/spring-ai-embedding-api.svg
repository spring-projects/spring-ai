<title id="embedding-api-title">The Embedding Model API and the generic Model API</title>
<desc id="embedding-api-desc">EmbeddingModel takes an EmbeddingRequest, which holds a list of texts and EmbeddingOptions, and returns an EmbeddingResponse, which holds one Embedding, a float array, per text. They implement the generic ModelOptions, ModelRequest, Model, ModelResponse and ModelResult.</desc>
