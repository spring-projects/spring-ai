<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" role="img" aria-labelledby="rag-title rag-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="rag-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker></defs>
<title id="rag-title">Retrieval augmented generation: ingestion and retrieval</title>
<desc id="rag-desc">Ahead of time, documents are read, split into chunks, embedded and stored in a vector store. For each question, the chunks closest to the question are retrieved from the vector store and added to the prompt, and the chat model answers from them.</desc>
<rect x="10" y="10" width="980" height="132" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="24.0" y="32.0" text-anchor="start" font-size="14" font-weight="700">Ingestion: ahead of time</text>
<rect x="10" y="214" width="980" height="160" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="24.0" y="236.0" text-anchor="start" font-size="14" font-weight="700">Retrieval: for each question</text>
<rect x="30" y="58" width="120" height="56" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="90.0" y="83.0" text-anchor="middle" font-size="13" font-weight="600">Documents</text><text x="90.0" y="100.0" text-anchor="middle" font-size="11" fill-opacity="0.75">PDF, HTML, …</text>



<rect x="200" y="58" width="130" height="56" rx="8" fill="#6DB33F"/><text x="265.0" y="83.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Read</text><text x="265.0" y="100.0" text-anchor="middle" font-size="11" fill="#fff">DocumentReader</text>
<rect x="380" y="58" width="150" height="56" rx="8" fill="#6DB33F"/><text x="455.0" y="83.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Split into chunks</text><text x="455.0" y="100.0" text-anchor="middle" font-size="11" fill="#fff">TextSplitter</text>
<rect x="580" y="58" width="140" height="56" rx="8" fill="#6DB33F"/><text x="650.0" y="83.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Embed</text><text x="650.0" y="100.0" text-anchor="middle" font-size="11" fill="#fff">EmbeddingModel</text>
<path d="M150.0 86.0 L196.0 86.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M330.0 86.0 L376.0 86.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M530.0 86.0 L576.0 86.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M720.0 86.0 L800.0 86.0 L800.0 150.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M745 158 v52 a55 8 0 0 0 110 0 v-52" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.4"/><ellipse cx="800.0" cy="158" rx="55.0" ry="8" fill="#6DB33F" fill-opacity="0.3" stroke="#6DB33F" stroke-width="1.4"/><text x="800.0" y="192.0" text-anchor="middle" font-size="13" font-weight="600">Vector</text><text x="800.0" y="207.0" text-anchor="middle" font-size="13" font-weight="600">store</text>
<rect x="30" y="278" width="120" height="56" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="90.0" y="303.0" text-anchor="middle" font-size="13" font-weight="600">Question</text><text x="90.0" y="320.0" text-anchor="middle" font-size="11" fill-opacity="0.75">from the user</text>
<rect x="200" y="278" width="150" height="56" rx="8" fill="#6DB33F"/><text x="275.0" y="303.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Search</text><text x="275.0" y="320.0" text-anchor="middle" font-size="11" fill="#fff">similar chunks</text>
<rect x="400" y="262" width="210" height="88" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="505.0" y="310.5" text-anchor="middle" font-size="13"></text>
<text x="505.0" y="284.0" text-anchor="middle" font-size="13" font-weight="700">Prompt</text>
<text x="505.0" y="304.0" text-anchor="middle" font-size="12" fill-opacity="0.85">the question</text>
<text x="505.0" y="322.0" text-anchor="middle" font-size="12" fill-opacity="0.85">+ the retrieved chunks</text>
<text x="505.0" y="340.0" text-anchor="middle" font-size="12" fill-opacity="0.85">+ “answer from this context”</text>
<rect x="660" y="278" width="130" height="56" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="725.0" y="310.5" text-anchor="middle" font-size="13">Chat model</text>
<rect x="840" y="278" width="130" height="56" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="905.0" y="310.5" text-anchor="middle" font-size="13">Answer</text>
<path d="M150.0 306.0 L196.0 306.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M350.0 306.0 L396.0 306.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M610.0 306.0 L656.0 306.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M790.0 306.0 L836.0 306.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#rag-arrow)"/>
<path d="M745.0 192.0 L275.0 192.0 L275.0 274.0" fill="none" stroke="#6DB33F" stroke-width="2.4" marker-end="url(#rag-arrow-green)"/>
<text x="510.0" y="186.0" text-anchor="middle" font-size="12" fill-opacity="0.8">chunks closest to the question</text>
</svg>
