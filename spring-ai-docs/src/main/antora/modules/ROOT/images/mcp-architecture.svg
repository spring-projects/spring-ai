<svg xmlns="http://www.w3.org/2000/svg" id="mcp-architecture" viewBox="0 0 1000 412" width="1000" role="img" aria-labelledby="mcp-architecture-title mcp-architecture-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<style>#mcp-architecture a{color:inherit;text-decoration:none}#mcp-architecture a:hover rect{stroke-width:2.4}</style>
<title id="mcp-architecture-title">MCP clients and servers in a Spring AI application</title>
<desc id="mcp-architecture-desc">Your Spring AI application is the MCP host. Its ChatClient talks to the AI model and uses the tools of MCP servers as tool callbacks. The application has one MCP client for each connection, created by the spring-ai-starter-mcp-client starter. Each client talks MCP, over STDIO or Streamable HTTP, to one MCP server, which can be your own Spring AI server or any other MCP server. Each server calls the API of the service behind it. The application developer builds the host; the service provider builds the servers.</desc>
<a href="../models/chat.html"><rect x="20" y="168" width="120" height="58" rx="7" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.35"/><text x="80.0" y="194.0" text-anchor="middle" font-size="13" font-weight="700">AI model</text><text x="80.0" y="210.0" text-anchor="middle" font-size="11" fill-opacity="0.75">chat model</text></a>
<path d="M140.0 197.0 L196.0 197.0" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.6"/><path d="M196.0 197.0 L188.0 192.5 L188.0 201.5 Z" fill="currentColor" fill-opacity="0.5"/><path d="M140.0 197.0 L148.0 201.5 L148.0 192.5 Z" fill="currentColor" fill-opacity="0.5"/>
<rect x="196" y="60" width="300" height="312" rx="12" fill="none" stroke="#6DB33F" stroke-width="1.2"/>
