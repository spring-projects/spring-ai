<rect x="10" y="164" width="200" height="40" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="110.0" y="188.5" text-anchor="middle" font-size="13">Stock prices fell today</text>
<path d="M212.0 184.0 L246.0 184.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#embeddings-arrow)"/>
<path d="M362.0 184.0 L396.0 184.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#embeddings-arrow)"/>
