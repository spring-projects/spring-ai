<rect x="610" y="36" width="300" height="168" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
<path d="M630 190 H890 M630 190 V52" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/>
<circle cx="690" cy="92" r="7" fill="#6DB33F"/>
<text x="678.0" y="96.0" text-anchor="end" font-size="12">cat</text>
<circle cx="722" cy="104" r="7" fill="#6DB33F"/>
<text x="734.0" y="108.0" text-anchor="start" font-size="12">kitten</text>
<circle cx="850" cy="166" r="7" fill="#6DB33F"/>
<text x="838.0" y="170.0" text-anchor="end" font-size="12">stocks</text>
