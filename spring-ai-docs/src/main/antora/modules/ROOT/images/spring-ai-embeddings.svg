<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 212" width="920" role="img" aria-labelledby="embeddings-title embeddings-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="embeddings-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="embeddings-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker></defs>
<title id="embeddings-title">Texts, their embeddings, and their distance in the vector space</title>
<desc id="embeddings-desc">An embedding model turns each text into a vector of numbers. 'A cat sits on the mat' and 'A kitten naps on a rug' get vectors that are close together in the vector space, because their meaning is similar. 'Stock prices fell today' is far from both.</desc>
<text x="110.0" y="22.0" text-anchor="middle" font-size="14" font-weight="700">Texts</text>
<text x="470.0" y="22.0" text-anchor="middle" font-size="14" font-weight="700">Vectors</text>
<text x="765.0" y="22.0" text-anchor="middle" font-size="14" font-weight="700">Vector space</text>
<rect x="250" y="40" width="110" height="164" rx="8" fill="#6DB33F"/><text x="305.0" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"></text>
<text x="305.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Embedding</text>
<text x="305.0" y="134.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">model</text>
<rect x="10" y="40" width="200" height="40" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="110.0" y="64.5" text-anchor="middle" font-size="13">A cat sits on the mat</text>
<path d="M212.0 60.0 L246.0 60.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#embeddings-arrow)"/>
<path d="M362.0 60.0 L396.0 60.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#embeddings-arrow)"/>
<rect x="400" y="40" width="140" height="40" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="470.0" y="64.5" text-anchor="middle" font-size="12">[0.21, -0.43, 0.88, …]</text>
<rect x="10" y="102" width="200" height="40" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="110.0" y="126.5" text-anchor="middle" font-size="13">A kitten naps on a rug</text>
<path d="M212.0 122.0 L246.0 122.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#embeddings-arrow)"/>
