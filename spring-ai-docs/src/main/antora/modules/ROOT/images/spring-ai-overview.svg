<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="760" role="img" aria-labelledby="sai-title sai-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<title id="sai-title">Spring AI connects your application to AI models</title>
<desc id="sai-desc">Spring AI sits between your application and AI models. In one direction it gives the model context: prompts, your documents and the conversation memory. In the other direction it brings answers and actions to your application: structured output, tool calling and the Model Context Protocol.</desc>

<!-- to the model -->
<path d="M130 120 V78 Q130 62 146 62 H774 Q790 62 790 78 V106" fill="none" stroke="#6DB33F" stroke-width="6" stroke-linecap="round"/>
<path d="M777 104 H803 L790 120 Z" fill="#6DB33F"/>
<text x="460" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#6DB33F">Context for the model</text>
<text x="460" y="45" text-anchor="middle" font-size="13">prompts · your documents · conversation memory</text>

<!-- to the application -->
