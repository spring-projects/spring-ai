<path d="M117 336 H143 L130 320 Z" fill="#6DB33F"/>
<text x="460" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#6DB33F">Answers and actions for your application</text>
<text x="460" y="419" text-anchor="middle" font-size="13">structured output · tool calling · Model Context Protocol</text>

