<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 440" width="970" role="img" aria-labelledby="message-api-title message-api-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
