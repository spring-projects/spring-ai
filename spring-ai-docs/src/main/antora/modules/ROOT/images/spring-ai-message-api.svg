<title id="message-api-title">The Message API</title>
<desc id="message-api-desc">Message extends Content, which holds the text and metadata, and adds the MessageType: SYSTEM, USER, ASSISTANT or TOOL. AbstractMessage holds the ordered MessageParts: TextPart, ReasoningPart, ToolCallPart, ToolResultPart, MediaPart and UnknownPart. SystemMessage, ToolResponseMessage, UserMessage and AssistantMessage extend AbstractMessage, and UserMessage and AssistantMessage also implement MediaContent.</desc>
