<rect x="10" y="160" width="200" height="154" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/><text x="110.0" y="175.0" text-anchor="middle" font-size="10.5" fill-opacity="0.7">«sealed interface»</text><text x="110.0" y="192.0" text-anchor="middle" font-size="13" font-weight="700">MessagePart</text><path d="M10 202 H210" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/><text x="18.0" y="219.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">TextPart</text><text x="18.0" y="236.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">ReasoningPart</text><text x="18.0" y="253.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">ToolCallPart</text><text x="18.0" y="270.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">ToolResultPart</text><text x="18.0" y="287.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">MediaPart</text><text x="18.0" y="304.0" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">UnknownPart</text>
