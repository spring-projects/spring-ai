<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900" role="img" aria-labelledby="mt-title mt-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<title id="mt-title">The model types of Spring AI, with their input and output</title>
<desc id="mt-desc">Chat models take text, plus images, audio or documents and return text, reasoning, tool calls. Embedding models take text, or images and return a vector of numbers. Image models take text and return images. Text to speech models take text and return audio. Transcription models take audio and return text. Moderation models take text and return flagged categories, with scores. Decision models take a question, its outcomes, an input and return the chosen outcome, with likelihoods.</desc>
