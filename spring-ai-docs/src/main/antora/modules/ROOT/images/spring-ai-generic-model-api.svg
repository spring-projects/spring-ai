<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 284" width="950" role="img" aria-labelledby="generic-model-api-title generic-model-api-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
