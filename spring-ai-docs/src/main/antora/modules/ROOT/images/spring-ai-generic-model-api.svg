<path d="M795.0 151.0 L795.0 196.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.3" marker-start="url(#generic-model-api-has)"/><text x="838.0" y="173.0" text-anchor="middle" font-size="11" fill-opacity="0.8" font-style="italic">results 0..*</text>
<text x="470.0" y="225.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75" font-family="ui-monospace, Menlo, Consolas, monospace">TReq extends ModelRequest&lt;?&gt;</text>
<text x="470.0" y="243.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75" font-family="ui-monospace, Menlo, Consolas, monospace">TRes, TResChunk extend ModelResponse&lt;?&gt;</text>
