<title id="generic-model-api-title">The generic Model API</title>
<desc id="generic-model-api-desc">Model takes a ModelRequest and returns a ModelResponse; StreamingModel returns a Flux of ModelResponse chunks. A ModelRequest holds the instructions and the ModelOptions. A ModelResponse holds one or more ModelResults and ResponseMetadata, and each ModelResult holds the output and ResultMetadata.</desc>
<rect x="330" y="10" width="250" height="57" rx="6" fill="#6DB33F"/><text x="455.0" y="30.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">Model&lt;TReq, TRes&gt;</text><path d="M330 40 H580" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><text x="338.0" y="57.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">call(TReq): TRes</text>
<rect x="330" y="120" width="264" height="57" rx="6" fill="#6DB33F"/><text x="462.0" y="140.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">StreamingModel&lt;TReq, TResChunk&gt;</text><path d="M330 150 H594" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><text x="338.0" y="167.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">stream(TReq): Flux&lt;TResChunk&gt;</text>
<rect x="10" y="60" width="250" height="74" rx="6" fill="#6DB33F"/><text x="135.0" y="80.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">ModelRequest&lt;T&gt;</text><path d="M10 90 H260" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><text x="18.0" y="107.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getInstructions(): T</text><text x="18.0" y="124.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getOptions(): ModelOptions</text>
<rect x="10" y="200" width="250" height="30" rx="6" fill="#6DB33F"/><text x="135.0" y="220.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">ModelOptions</text>
<rect x="650" y="60" width="328" height="91" rx="6" fill="#6DB33F"/><text x="814.0" y="80.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">ModelResponse&lt;T extends ModelResult&lt;?&gt;&gt;</text><path d="M650 90 H978" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><text x="658.0" y="107.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getResult(): T</text><text x="658.0" y="124.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getResults(): List&lt;T&gt;</text><text x="658.0" y="141.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getMetadata(): ResponseMetadata</text>
<rect x="650" y="200" width="290" height="74" rx="6" fill="#6DB33F"/><text x="795.0" y="220.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-style="italic">ModelResult&lt;T&gt;</text><path d="M650 230 H940" stroke="#fff" stroke-opacity="0.6" stroke-width="1"/><text x="658.0" y="247.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getOutput(): T</text><text x="658.0" y="264.0" text-anchor="start" font-size="11.5" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">getMetadata(): ResultMetadata</text>
