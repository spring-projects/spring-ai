<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1213 232" width="1213" role="img" aria-labelledby="chat-api-title chat-api-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
