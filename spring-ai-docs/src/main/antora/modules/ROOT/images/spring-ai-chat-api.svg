<title id="chat-api-title">The Chat Model API and the generic Model API</title>
<desc id="chat-api-desc">ChatModel takes a Prompt, which holds a list of messages and ChatOptions, and returns a ChatResponse, which holds Generations with an AssistantMessage each. ChatOptions, Prompt, ChatModel, ChatResponse and Generation implement the generic ModelOptions, ModelRequest, Model, ModelResponse and ModelResult.</desc>
