<path d="M520.0 254.0 L520.0 243.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M350.0 305.0 L350.0 316.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M520.0 316.0 L520.0 305.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M350.0 367.0 L350.0 378.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M520.0 378.0 L520.0 367.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M350.0 428.0 L350.0 440.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<path d="M520.0 442.0 L520.0 430.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#advisor-chain-arrow)"/>
<text x="340.0" y="64.0" text-anchor="end" font-size="11" fill-opacity="0.75" font-style="italic">ChatClientRequest</text>
<text x="530.0" y="64.0" text-anchor="start" font-size="11" fill-opacity="0.75" font-style="italic">ChatClientResponse</text>
<path d="M676 156.0 H710 V463.0 H676" fill="none" stroke="#6DB33F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="718.0" y="301.5" text-anchor="start" font-size="12" font-weight="600" fill="#6DB33F">for each tool round,</text>
<text x="718.0" y="317.5" text-anchor="start" font-size="12" font-weight="600" fill="#6DB33F">the rest of the chain</text>
<text x="718.0" y="333.5" text-anchor="start" font-size="12" font-weight="600" fill="#6DB33F">runs again (chain.copy)</text>
</svg>
