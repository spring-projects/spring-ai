<title id="model-hierarchy-title">The model interfaces of Spring AI</title>
<desc id="model-hierarchy-desc">Seven model interfaces extend the generic Model interface: ChatModel, TranscriptionModel, TextToSpeechModel, EmbeddingModel, ImageModel, ModerationModel and DecisionModel. ChatModel, TranscriptionModel and TextToSpeechModel also extend StreamingChatModel, StreamingTranscriptionModel and StreamingTextToSpeechModel, which extend the generic StreamingModel interface.</desc>
