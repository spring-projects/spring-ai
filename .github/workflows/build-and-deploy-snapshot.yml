name: Build and Deploy Snapshot

on:
  push:
    branches:
      - 'main'
      - '[0-9].[0-9].x'
      - '[0-9].[0-9].x-internal'
  schedule:
    - cron: '30 11 * * 1-5'  # 12:30 PM CET / 6:30 AM
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: Build all modules
    if: ${{ github.repository_owner == 'spring-projects' }}
    runs-on: ${{ vars.COMMERCIAL && vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Setup Maven Build-Cache (~/.m2/build-cache)
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          # See pr-check.yml for an explanation of the key format
          key: build-cache-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            build-cache-${{ runner.os }}-

      - name: Build all modules with unit tests
        env:
          COMMERCIAL_ARTIFACTORY_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
          COMMERCIAL_ARTIFACTORY_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
          COMMERCIAL_SNAPSHOT_REPO_URL: "${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}"
          COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        run: |
          ./mvnw ${{ vars.COMMERCIAL && '-s commercial-settings.xml -Pcommercial' || '' }} --batch-mode -ntp --update-snapshots clean install

      - name: Upload Spring-AI Built Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: ~/.m2/repository/org/springframework/ai
          retention-days: 1 # Intent is to share only with downstream jobs in this workflow

      - name: Purge Spring AI Built Artifacts # We don't want the setup-java m2 cache to capture our products, only our deps
        run: rm -fr ~/.m2/repository/org/springframework/ai


  test-ollama:
    name: Test Ollama
    if: ${{ github.repository_owner == 'spring-projects' }}
    runs-on: ${{ vars.COMMERCIAL && vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    needs: build-all
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      OLLAMA_WITH_REUSE: true
      OLLAMA_AUTOCONF_TESTS_ENABLED: "true"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Setup Maven Build-Cache (~/.m2/build-cache)
        uses: actions/cache@v5
        if: ${{ github.event_name != 'schedule' }}
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ runner.os }}-ollama-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ runner.os }}-ollama-${{ hashFiles('**/pom.xml') }}-
            build-cache-${{ runner.os }}-

      - name: Download Spring-AI Built Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ~/.m2/repository/org/springframework/ai

      - name: Configure Testcontainers
        run: echo "testcontainers.reuse.enable=true" > $HOME/.testcontainers.properties

      - name: Test Ollama modules
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMERCIAL_ARTIFACTORY_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
          COMMERCIAL_ARTIFACTORY_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
          COMMERCIAL_SNAPSHOT_REPO_URL: "${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}"
          COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        run: |
          ./mvnw ${{ vars.COMMERCIAL && '-s commercial-settings.xml -Pcommercial' || '' }} --batch-mode -ntp --no-snapshot-updates \
            -pl models/spring-ai-ollama,auto-configurations/models/spring-ai-autoconfigure-model-ollama \
            -Pci-fast-integration-tests \
            -Dfailsafe.rerunFailingTestsCount=3 \
            verify


  test-openai:
    name: Test OpenAI
    if: ${{ github.repository_owner == 'spring-projects' }}
    runs-on: ${{ vars.COMMERCIAL && vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    needs: build-all
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Setup Maven Build-Cache (~/.m2/build-cache)
        uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ runner.os }}-openai-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ runner.os }}-openai-${{ hashFiles('**/pom.xml') }}-
            build-cache-${{ runner.os }}-

      - name: Download Spring-AI Built Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ~/.m2/repository/org/springframework/ai

      - name: Configure Testcontainers
        run: echo "testcontainers.reuse.enable=true" > $HOME/.testcontainers.properties

      - name: Test OpenAI modules
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMERCIAL_ARTIFACTORY_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
          COMMERCIAL_ARTIFACTORY_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
          COMMERCIAL_SNAPSHOT_REPO_URL: "${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}"
          COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        run: |
          ./mvnw ${{ vars.COMMERCIAL && '-s commercial-settings.xml -Pcommercial' || '' }} --batch-mode -ntp --no-snapshot-updates \
            -pl models/spring-ai-openai,auto-configurations/models/spring-ai-autoconfigure-model-openai \
            -Pci-fast-integration-tests \
            -Dfailsafe.rerunFailingTestsCount=3 \
            verify


  test-remaining:
    name: Test Remaining (MCP, Google GenAI, Vertex AI Embedding, Chroma, PgVector)
    if: ${{ github.repository_owner == 'spring-projects' }}
    runs-on: ${{ vars.COMMERCIAL && vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    needs: build-all
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Setup Maven Build-Cache (~/.m2/build-cache)
        uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ runner.os }}-other-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ runner.os }}-other-${{ hashFiles('**/pom.xml') }}-
            build-cache-${{ runner.os }}-

      - name: Download Spring-AI Built Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ~/.m2/repository/org/springframework/ai

      - name: Configure Testcontainers
        run: echo "testcontainers.reuse.enable=true" > $HOME/.testcontainers.properties

      - name: Test remaining modules
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMERCIAL_ARTIFACTORY_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
          COMMERCIAL_ARTIFACTORY_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
          COMMERCIAL_SNAPSHOT_REPO_URL: "${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}"
          COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        run: |
          ./mvnw ${{ vars.COMMERCIAL && '-s commercial-settings.xml -Pcommercial' || '' }} --batch-mode -ntp --no-snapshot-updates \
            -pl models/spring-ai-google-genai, \
            -pl auto-configurations/models/spring-ai-autoconfigure-model-google-genai, \
            ${{ vars.COMMERCIAL && '-pl models/spring-ai-vertex-ai-embedding,' || '-pl mcp/mcp-annotations,' }} \
            -pl mcp/common, \
            -pl mcp/transport/mcp-spring-webflux, \
            -pl mcp/transport/mcp-spring-webmvc, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-client-common, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-client-httpclient, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-client-webflux, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-server-common, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-server-webmvc, \
            -pl auto-configurations/mcp/spring-ai-autoconfigure-mcp-server-webflux, \
            -pl vector-stores/spring-ai-chroma-store, \
            -pl vector-stores/spring-ai-pgvector-store, \
            -pl spring-ai-integration-tests \
            -Pci-fast-integration-tests \
            -Dfailsafe.rerunFailingTestsCount=3 \
            verify


  deploy-artifactory:
    name: Deploy to Artifactory
    if: ${{ github.repository_owner == 'spring-projects' && github.event_name != 'schedule' }}
    runs-on: ${{ vars.COMMERCIAL && vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    needs: [build-all, test-ollama, test-openai, test-remaining]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Setup Maven Build-Cache (~/.m2/build-cache)
        uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            build-cache-${{ runner.os }}-

      - name: Deploy to Artifactory
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          COMMERCIAL_ARTIFACTORY_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
          COMMERCIAL_ARTIFACTORY_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
          COMMERCIAL_SNAPSHOT_REPO_URL: "${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}"
          COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        run: |
          ./mvnw ${{ vars.COMMERCIAL && '-s commercial-settings.xml -Pcommercial' || '-s settings.xml' }} --batch-mode -ntp -Dmaven.test.skip \
            ${{ vars.COMMERCIAL && format('-DaltSnapshotDeploymentRepository=spring-enterprise-snapshot::{0}', vars.COMMERCIAL_SNAPSHOT_REPO_URL) || '' }} \
            deploy
